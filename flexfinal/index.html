<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset = "UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="FLEX - an adaptive in-vehicle ambient system. Interactive prototype:  calm, alarm-free peripheral light that reflects the driver's state.">
    <title>FLEX - Adaptive In-Vehicle Ambient System · Interactive Prototype </title>
    <link rel="preconnect" href = "https://fonts.googleapis.com">
    <link rel="preconnect" href = "https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Syncopate:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.js"></script>
    <style> 
    :root { --fg: rgba(255,255,255,0.92); --fg-dim: rgba(255, 255, 255, 0.66); --line: rgba(255, 255, 255, 0.30); }
    html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #0A0A0E; 
    font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif; }
    canvas {display: block; }

    #hud{position: fixed; inset: 0; pointer-events: none; transition: opacity .4s ease; }
    #hud.hidden {opacity: 0;}
    #hud.hidden * {pointer-events: none !important; } 
     .head {position: absolute; top: 28px; left: 32px; right: 32px; }
     .brand {color: var(--fg-dim); font-size: 12px; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 10px; }
     .status {color: var(--fg); font-size: 16px; font-weight: 500; letter-spacing: .4px;  }

     .bottom {position: absolute; left: 0; right: 0; bottom: 24px; display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 0 16px; } 
     #levelbar {display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 8px; pointer-events: auto; }
     .controls {color: var( --fg-dim); font-size: 12px; letter-spacing: .6px; text-align: center; }
     .sep {width : 1px; height: 22px; background: var(--line); margin: 0 4px; }

     .btn { font: inherit; font-size: 13px; color: var(--fg); background: rgba(255, 255, 255, 0.07); border: 1px solid var(--line); 
    border-radius: 999px; padding: 9px 16px; min-height: 40px; cursor: pointer; transition: background .2s, color .2s;}
    .btn.small { padding: 9px 13px; min-width: 40px; }
    .btn:hover {background: rgba(255, 255, 255, 0.16) ;}
    .btn.active { background: rgba(255, 255, 255, 0.92); color: #0A0A0E; border-color: transparent;  }
    .btn:focus-visible, .dot:focus-visible, #reveal:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }
    
    #theme-dots { position: absolute; right: 24px; top: 50%; transform: translateY(-50%); display: flex; flex-direction: column; gap: 6px; pointer-events: auto; }
    .dot {width: 24px; height: 24px; border: 0; padding: 0; background: transparent; cursor: pointer; position: relative; }
    .dot::after { content: ""; position: absolute; top: 50%; left: 50%; width: 6px; height: 6px; border-radius: 50%; 
      background: rgba(255, 255, 255, 0.35); transform: translate(-50%, -50%); transition: all .3s ease; }
    .dot.active::after {width: 9px; height: 9px; background: #fff; box-shadow: 0 0 10px rgba(255, 255, 255, .35); }
    
    #reveal { position: fixed; right: 16px; bottom: 16px; width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line); 
     background: rgba(255, 255, 255,0.070); color: var(--fg); cursor: pointer; font-size: 13px; opacity: 0; transition: opacity .3s; }
        #hud.hidden ~ #reveal { opacity: .8; pointer-events: auto; }
        #hud:not(.hidden) ~ #reveal { pointer-events: none; }

/* intro */
body.intro #hud { opacity: 0; }
body.intro #hud * {pointer-events: none !important; }
body.intro #reveal { opacity: 0 !important; pointer-events: none !important; }

#intro-line { position: fixed; left: 0; right: 0; top: 66%; padding: 0 24px; text-align: center; 
 font-family:"Syncopate", -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; text-transform: uppercase; 
 color: var(--fg); font-size: clamp(10px, 1.2vw, 14px); letter-spacing: .22em; 
 opacity: 0; transition: opacity .9s ease; pointer-events: none; }
#intro-line.on {opacity: 1; }

#skip-hint { position: fixed; left: 0; right: 0; bottom: 20px; text-align: center; 
 color: var(--fg-dim); font-size:12px; letter-spacing: .6px; 
 opacity: 0; transition: opacity .6s; pointer-events: none; }
body.intro #skip-hint {opacity: 1; }

@media (max-width: 640px) { .head { top: 18px; left: 18px; } .status {font-size: 14px; } #theme-dots {right:  8px; }}
@media (prefers-reduced-motion: reduce) {#hud, .btn, .dot:after, #intro-line, #skip-hint {transition: none; }}
</style>
</head>
<body>
    <div id="hud">
        <div class = "head">
            <div class = "brand" id="brand-text">FLEX</div>
            <div class = "status" id="status-text" aria-live="polite"></div>
        </div>
    <div id ="theme-dots" role="group" aria-label= "Colour themes"></div>
    <div class ="bottom">
       <div id="levelbar" role="group" aria-label ="State controls"></div>
       <div class="controls" id="controls-text"></div>
    </div>
     </div>
     <button id="reveal" type="button" aria-label="Show interface">☰</button>
     <div id="intro-line" aria-live="polite"></div>
     <div id="skip-hint">Click or press any key to skip</div>
     <noscript>This prototype needs Javascript and WebGL</noscript>
     <script src="sketch.js"></script>
</body>
</html>
